name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # cheap checks first, so a typo fails in seconds rather than after a
  # multi-architecture image build
  check:
    name: Lint and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check kpwpvs migrations

      - name: Format check
        run: ruff format --check kpwpvs migrations

      - name: Import every module
        run: |
          python -c "
          import importlib, pkgutil, sys
          import kpwpvs
          failed = []
          for mod in pkgutil.walk_packages(kpwpvs.__path__, 'kpwpvs.'):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append((mod.name, exc))
          for name, exc in failed:
              print(f'FAILED {name}: {exc}')
          sys.exit(1 if failed else 0)
          "

  # the migrations have to actually apply, against the database we ship
  migrate:
    name: Migrations against MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: kpwpvs
          MARIADB_USER: kpwpvs
          MARIADB_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      KPWPVS_DATABASE_HOST: 127.0.0.1
      KPWPVS_DATABASE_PORT: "3306"
      KPWPVS_DATABASE_NAME: kpwpvs
      KPWPVS_DATABASE_USER: kpwpvs
      KPWPVS_DATABASE_PASSWORD: ci
      KPWPVS_SECRET_KEY: ci-secret-key-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Apply, roll back, and reapply
        run: |
          kpwpvs db wait --timeout 90
          kpwpvs db upgrade
          kpwpvs db status
          python -m alembic downgrade base
          kpwpvs db upgrade

      - name: The seed data landed
        run: |
          python -c "
          from kpwpvs.core.config import load_config
          from kpwpvs.core.db import init_engine, session_scope
          from kpwpvs.core.settings import SETTINGS
          from kpwpvs.models import Feed
          from sqlalchemy import select
          init_engine(load_config())
          with session_scope() as s:
              feeds = s.execute(select(Feed)).scalars().all()
              assert len(feeds) == 3, f'expected 3 feeds, found {len(feeds)}'
              for f in feeds:
                  assert isinstance(f.options, dict), f'{f.source} options came back as {type(f.options)}'
              print(f'ok: {len(feeds)} feeds, {len(SETTINGS)} settings')
          "

      - name: An admin can be created and can sign in
        run: |
          printf '%s\n' 'a-sufficiently-long-password' | kpwpvs user add ci --role admin
          python -c "
          from kpwpvs.core.config import load_config
          from kpwpvs.core.db import init_engine, session_scope
          from kpwpvs.models import User
          from kpwpvs.web.security import verify_password
          from sqlalchemy import select
          init_engine(load_config())
          with session_scope() as s:
              u = s.execute(select(User).where(User.username=='ci')).scalar_one()
              assert verify_password(u.password_hash, 'a-sufficiently-long-password')
              assert not verify_password(u.password_hash, 'wrong')
              print('ok: password hashing round trips')
          "

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [check, migrate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # pull requests build to prove the image still builds, but nothing
      # gets pushed from one
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
