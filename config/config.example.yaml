# KP WP VulnScan configuration
#
# copy this to config/config.yaml (or mount it at /config/config.yaml) and
# adjust to taste. every value below can also be set with an environment
# variable, using the KPWPVS_ prefix and the dotted path uppercased with
# underscores, eg. KPWPVS_DATABASE_PASSWORD or KPWPVS_WEB_PORT. the
# environment always wins over what is in this file.

# verbose logging, leave off unless you are chasing something
debug: false

# where checkpoints, caches, and scratch work land
data_dir: /data

# mariadb / mysql connection
database:
  host: db
  port: 3306
  name: kpwpvs
  user: kpwpvs
  password: ""
  charset: utf8mb4
  pool_size: 5
  pool_recycle: 3600
  echo: false

# how we walk the wordpress.org plugin repository
crawler:
  user_agent: "kp-wp-vulnscan/0.1 (+https://github.com/kpirnie/kp-wp-vulnscan)"
  concurrency: 4
  request_timeout: 30
  max_retries: 3
  retry_backoff: 2.0
  rate_limit_delay: 0.25
  per_page: 100
  checkpoint_every: 5

# vulnerability data sources
feeds:

  # primary source, free and keyless
  wordfence:
    enabled: true
    url: "https://www.wordfence.com/api/intelligence/v2/vulnerabilities/production"
    timeout: 120

  # supplemental, the api key is optional but raises the rate limit a lot
  nvd:
    enabled: true
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
    api_key: ""
    timeout: 60
    lookback_days: 14

# report output, the database is always written, these are the extras
reporting:

  # file reports only get written when this directory actually exists
  output_dir: /reports
  json_enabled: true
  html_enabled: true
  retention: 52

  # only fires when enabled and a url is set
  webhook:
    enabled: false
    url: ""
    format: generic   # slack, discord, or generic
    timeout: 30
    min_severity: medium

# the web interface
web:
  host: 0.0.0.0
  port: 8080

  # required, sessions are signed with it. generate one with:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
  secret_key: ""
  session_ttl: 86400

  # leave on unless something in front of this handles authentication
  auth_enabled: true
  base_url: ""

# ai provider, used by the local source scanning phase
ai:
  enabled: false

  # anthropic, openai, google, ollama, or custom
  provider: anthropic
  api_key: ""
  model: claude-sonnet-5

  # override for self hosted or non standard endpoints
  base_url: ""
  max_tokens: 4096
  temperature: 0.0
  request_timeout: 120

  # cap the spend, only scan this many plugins per run
  max_plugins_per_run: 25
